# Matriz de capacidades de Cuadra para marketing.
# La lee el auditor de calidad: una pieza solo puede afirmar lo que esta matriz permite.
# Fuente: auditoría del repositorio axel29-bm/contatony-2, commit 0411f76, 14/10/2026.
# Al cambiar un estado, anota la evidencia y la fecha. Ver docs/AUDITORIA-CUADRA.md.
#
# estado: IMPLEMENTADO_VERIFICADO | IMPLEMENTADO_PARCIAL | EN_DESARROLLO | PLANIFICADO | SIN_EVIDENCIA
# uso:    PERMITIDO     se puede afirmar con la frase sugerida
#         CON_MATICES   se puede afirmar solo con la aclaración indicada
#         SOLO_DEMO     solo se muestra en una demostración guiada, no se promete
#         NO_ANUNCIAR   no aparece en ninguna pieza como prestación

