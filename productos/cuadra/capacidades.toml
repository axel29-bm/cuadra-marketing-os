# Afirmaciones prohibidas en cualquier pieza de Cuadra, independientes de una capacidad.
[[prohibicion_global]]
patron = "cumple(n)? con (la )?SUNAT|homologad[oa]|certificad[oa] por SUNAT"
motivo = "Ningún caso contable está firmado y no consta homologación."

[[prohibicion_global]]
patron = "(miles|cientos|\\d+) de contadores (ya )?(lo )?usan|usado por \\d+"
motivo = "No hay usuarios."

[[prohibicion_global]]
patron = "ahorra(s|r[aá]s)? \\d+ ?(%|horas)|\\d+ ?% m[aá]s r[aá]pido"
motivo = "No hay mediciones de ahorro de tiempo."

[[prohibicion_global]]
patron = "[uú]ltimos? cupos|solo quedan \\d+|oferta termina (hoy|ma[nñ]ana)"
motivo = "Escasez inventada."
