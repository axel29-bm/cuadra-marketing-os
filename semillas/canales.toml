# Formatos y límites por canal que usan la fábrica (tamaños de exportación) y el auditor (longitudes).
# Los máximos de texto son límites prácticos conocidos y quedan POR VERIFICAR en la ayuda oficial de cada red
# (las páginas de ayuda no cargaron durante la investigación del 2026-10-14). Si un límite real es mayor,
# el auditor solo será más estricto de la cuenta; nunca dejará pasar algo que la red rechace por largo.
# recomendado_* son longitudes que se leen sin cortar en el móvil; superarlas da advertencia, no bloqueo.

