# Fuentes que vigila el radar. Las oficiales son las únicas que cuentan como fuente primaria de una noticia.
# Revisado el 2026-10-14 (investigación D). Reglas de cortesía: respetar robots.txt, una petición por recurso
# y pasada, 5 s entre peticiones al mismo dominio, nunca rutas prohibidas ni sistemas con clave (SOL).
# metodo: SITEMAP (lee un sitemap XML), RSS, HTML (detecta cambios en la página) o MANUAL (lo revisa una persona).

[[fuente]]
slug = "elperuano-normas-sitemap"
tipo = "OFICIAL"
organismo = "Editora Perú · El Peruano"
titulo = "Normas legales del día (buscador de El Peruano)"
url = "https://busquedas.elperuano.pe/"
rss_url = "https://busquedas.elperuano.pe/sitemap/sitemap-normas_legales.xml"
