# Campaña de prelanzamiento de Cuadra: 30 días, del jueves 15/10/2026 al viernes 13/11/2026.
# Para empezar otro día: python -m mos campana mover campanas/lista-espera-beta --semanas 1 (mueve todas las fechas).
# Cada [[pieza]] es una publicación en un canal. `basado_en` reutiliza otra pieza y cambia solo lo suyo.
# Cargar en la base:   python -m mos campana cargar campanas/lista-espera-beta
# Renderizar archivos: python -m mos campana render campanas/lista-espera-beta
# Calendario legible:  python -m mos campana calendario campanas/lista-espera-beta
# Paquete para publicar: python -m mos campana paquete campanas/lista-espera-beta
# Nada de esto se publica solo: cada pieza espera tu aprobación en el panel.

[campana]
slug = "lista-espera-beta"
producto = "cuadra"
nombre = "Lista de espera de la beta privada"
objetivo = "Reunir a los primeros contadores interesados en probar Cuadra en la beta privada, con su consentimiento, y aprender qué problema les pesa más."
hipotesis = "Los contadores que llevan muchas empresas responden más al contenido práctico del oficio (cierre, SIRE, correlativos, copias) que a los anuncios. Si ese contenido lo firma alguien que construye la herramienta con ellos, genera conversaciones y pedidos de beta."
oferta = "Participar en la beta privada y ver una demostración en vivo con una empresa de ejemplo"
cta = "Escríbenos «BETA» por mensaje"
metrica_exito = "Contadores en la lista de espera con consentimiento registrado"
meta_valor = 30
audiencia = "contador-multiempresa"
inicio = "2026-10-15"
fin = "2026-11-13"

# ---------------------------------------------------------------- días sin publicación

[[dia]]
fecha = "2026-10-18"
actividad = "Revisión semanal: registra las métricas de la semana, responde los mensajes, registra los leads con su consentimiento y graba la voz del vídeo C13 con su teleprompter."
objetivo = "Medir y preparar"

[[dia]]
fecha = "2026-10-25"
actividad = "Revisión semanal: métricas, mensajes y leads. Publica en historias la lámina de respuesta de la trivia. Pide a un contador que revise la noticia C12."
objetivo = "Medir y preparar"

[[dia]]
fecha = "2026-11-01"
actividad = "Revisión semanal: métricas, mensajes y leads. Decide si autorizas publicar la landing con el formulario de la lista de espera (desde ahí, el llamado cambia a «Únete a la lista de espera»)."
objetivo = "Medir y decidir"

[[dia]]
fecha = "2026-11-08"
actividad = "Revisión semanal: métricas, mensajes y leads. Agenda las demostraciones pedidas y elige qué tres piezas repetir en noviembre."
objetivo = "Medir y decidir"

